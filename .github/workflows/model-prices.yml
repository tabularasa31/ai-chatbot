name: Model prices

on:
  schedule:
    # Weekly: price cuts land whenever OpenAI ships, not when we open a PR.
    - cron: "17 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      # Deliberately not config.py: a price cut upstream must not redden
      # every unrelated PR that happens to touch settings.
      - 'backend/core/model_prices.json'
      - 'scripts/update_model_prices.py'
      - '.github/workflows/model-prices.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Snapshot matches upstream
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare vendored prices with upstream
        run: python scripts/update_model_prices.py --check

  refresh:
    name: Open a PR when prices moved
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      BRANCH: chore/model-prices

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # An open PR on the branch may carry a reviewer's own commits, and a
      # force-push would discard them — leave it to be merged first.
      - name: Look for an open pull request
        id: open_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number' | head -1)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            echo "Pull request #$number is still open — leaving it alone."
          fi

      - name: Refresh the price snapshot
        if: steps.open_pr.outputs.number == ''
        shell: bash
        run: |
          set -o pipefail
          python scripts/update_model_prices.py | tee refresh.log

      # The snapshot is rewritten only when a rate actually moved, so most
      # weeks this job ends here and nobody hears from it.
      - name: Propose the refreshed prices
        if: steps.open_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- backend/core/model_prices.json; then
            echo "Prices unchanged — nothing to propose."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add backend/core/model_prices.json
          git commit -m "chore(pricing): refresh vendored OpenAI token prices"
          git push --force origin "$BRANCH"

          {
            echo "Upstream token prices moved. Rates come from LiteLLM's price list;"
            echo "this branch is written by \`scripts/update_model_prices.py\`."
            echo
            echo "Actions cannot trigger other workflows, so the suite does not run here."
            echo
            echo '```'
            cat refresh.log
            echo '```'
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(pricing): refresh vendored OpenAI token prices" \
            --body-file pr-body.md
