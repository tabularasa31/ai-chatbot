proxy_cache_path /var/cache/nginx/widget levels=1:2 keys_zone=widget_cache:10m max_size=100m inactive=1h use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name widget-ru.getchat9.live api-ru.getchat9.live;
    return 301 https://$host$request_uri;
}

# widget-ru.getchat9.live -> Vercel (chat9-widget)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name widget-ru.getchat9.live;

    ssl_certificate /etc/letsencrypt/live/widget-ru.getchat9.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widget-ru.getchat9.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    resolver_timeout 5s;

    # Everything the widget iframe loads must match here. Vercel's bot
    # protection challenges proxied browser requests, and the challenge can
    # never complete inside a cross-site iframe; fetching as a header-stripped
    # technical client and serving visitors from the local cache avoids it.
    location ~* ^/(widget\.js|v1/|v1/.*\.(js|css|map|woff2?|svg|png|ico))$ {
        set $upstream "widget.getchat9.live";

        proxy_pass https://$upstream;
        proxy_set_header Host $upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_set_header Sec-Fetch-Mode "";
        proxy_set_header Sec-Fetch-Dest "";
        proxy_set_header Sec-Fetch-User "";
        proxy_set_header Sec-Ch-Ua "";
        proxy_set_header Sec-Ch-Ua-Mobile "";
        proxy_set_header Sec-Ch-Ua-Platform "";
        proxy_set_header User-Agent "chat9-edge/1.0";

        proxy_cache widget_cache;
        proxy_cache_valid 200 301 302 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_ignore_headers Set-Cookie Cache-Control;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        set $upstream "widget.getchat9.live";

        proxy_pass https://$upstream;
        proxy_set_header Host $upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# api-ru.getchat9.live -> Railway (API)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-ru.getchat9.live;

    ssl_certificate /etc/letsencrypt/live/widget-ru.getchat9.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widget-ru.getchat9.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 25m;

    location / {
        set $upstream "ai-chatbot-production-6531.up.railway.app";

        proxy_pass https://$upstream;
        proxy_set_header Host $upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Railway sees this VM as the caller, so the visitor's address goes in
        # its own header, vouched for by the secret kept outside the repo.
        proxy_set_header X-Chat9-Visitor-IP $remote_addr;
        include /etc/nginx/chat9-edge-secret.conf;

        # SSE chat streaming
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
