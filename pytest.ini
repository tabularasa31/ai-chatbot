[pytest]
markers =
    pgvector: Tests that require a real PostgreSQL instance with pgvector extension (run with -m pgvector).
    smoke: Fast P0 regression tests (auth, chat, escalation) run by `make smoke`.
    escalation: Escalation edge-case tests run by `make escalation`.
    rag_edge: RAG pipeline edge-case tests run by `make rag-edge`.
    auth_reset: Forgot/reset password flow tests run by `make auth-reset`.
