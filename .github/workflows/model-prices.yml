name: Model prices

on:
  schedule:
    # Weekly: price cuts land whenever OpenAI ships, not when we open a PR.
    - cron: "17 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - 'backend/core/model_prices.json'
      - 'backend/core/config.py'
      - 'scripts/update_model_prices.py'
      - '.github/workflows/model-prices.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Snapshot matches upstream
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compare vendored prices with upstream
        run: python scripts/update_model_prices.py --check

  refresh:
    name: Open a PR when prices moved
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh the price snapshot
        run: python scripts/update_model_prices.py | tee refresh.log

      # The snapshot is rewritten only when a rate actually moved, so most
      # weeks this job ends here and nobody hears from it.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/model-prices
        run: |
          if git diff --quiet -- backend/core/model_prices.json; then
            echo "Prices unchanged — nothing to propose."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add backend/core/model_prices.json
          git commit -m "chore(pricing): refresh vendored OpenAI token prices"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Existing pull request updated."
            exit 0
          fi

          {
            echo "Upstream token prices moved. Rates come from LiteLLM's price list;"
            echo "this branch is written by \`scripts/update_model_prices.py\`."
            echo
            echo '```'
            cat refresh.log
            echo '```'
          } > pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(pricing): refresh vendored OpenAI token prices" \
            --body-file pr-body.md
